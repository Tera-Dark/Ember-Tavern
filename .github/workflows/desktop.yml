name: Desktop build and Windows package
on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths: ['desktop/**', 'launcher/**', 'server/**', 'web/**', 'static/**', 'launcher-manifest.json', 'requirements-lock.txt', 'requirements-dev.txt', 'tests/browser_m0.py', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'launcher/**', 'server/**', 'web/**', 'static/**', 'launcher-manifest.json', 'requirements-lock.txt', 'requirements-dev.txt', 'tests/browser_m0.py', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'After all checks, publish a NEW immutable version (never replace assets)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: launcher/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify coordinated desktop / engine / host versions
        run: node desktop/scripts/release-metadata.mjs versions
      - name: Install production and test dependencies
        run: pip install -r requirements-lock.txt -r requirements-dev.txt
      - name: Verify backend and print failure summary
        shell: pwsh
        run: |
          python -m pytest -q --tb=short > backend-test.log 2>&1
          $code=$LASTEXITCODE
          Get-Content backend-test.log
          if ($code -ne 0) { Get-Content backend-test.log | Out-File -Append $env:GITHUB_STEP_SUMMARY; exit $code }
      - name: Publish failure diagnostics on this commit (no paid keys)
        if: failure() && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path backend-test.log) {
            $text=(Get-Content backend-test.log | Select-Object -Last 90) -join "`n"
            $body="Windows / Python 3.13 backend verification failed. CI-only test data, no real provider credentials.`n``````text`n$text`n``````"
            @{body=$body} | ConvertTo-Json | Set-Content -Encoding utf8 failure-comment.json
            gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input failure-comment.json
          }
      - name: Build release web and native engine
        shell: pwsh
        run: |
          npm ci --prefix web
          npm run build --prefix web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force desktop/resources/bin | Out-Null
          Push-Location launcher
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags='-H windowsgui -s -w' -o ../desktop/resources/bin/ember-engine.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - run: npm ci --prefix desktop
      - run: npm run prepare:host --prefix desktop
      - run: npm run build --prefix desktop
      - run: npm test --prefix desktop
      - name: Package installer and portable EXE (unsigned)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run package:win --prefix desktop > desktop-package.log 2>&1
          $code=$LASTEXITCODE
          Get-Content desktop-package.log
          if ($code -ne 0) {
            $text=(Get-Content desktop-package.log | Select-Object -Last 70) -join "`n"
            @{body="Windows EXE packaging failure (build log):`n``````text`n$text`n``````"} | ConvertTo-Json | Set-Content -Encoding utf8 package-error.json
            gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input package-error.json
            exit $code
          }
          Get-ChildItem desktop/dist/*.exe | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Real Windows Electron smoke (isolated demo data)
        shell: pwsh
        env:
          GEMINI_API_KEY: ''
          DECISION_API_KEY: ''
          TTS_API_KEY: ''
          GH_TOKEN: ${{ github.token }}
        run: |
          $installPath=Join-Path $env:RUNNER_TEMP 'ember-installed'
          $installer=(Get-ChildItem desktop/dist/*-setup.exe | Select-Object -First 1).FullName
          $install=Start-Process -FilePath $installer -ArgumentList "/S /D=$installPath" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          $env:EMBER_SMOKE_EXE=(Resolve-Path "$installPath/余烬桌面.exe").Path
          $env:EMBER_SMOKE_PYTHON=(python -c 'import sys;print(sys.executable)')
          $env:EMBER_SMOKE_REPORT=(Join-Path $pwd 'desktop-smoke.json')
          node desktop/tests/electron-smoke.cjs > desktop-smoke.log 2>&1
          $code=$LASTEXITCODE
          Get-Content desktop-smoke.log
          if ($code -ne 0) {
            $text=(Get-Content desktop-smoke.log | Select-Object -Last 65) -join "`n"
            if (Test-Path desktop-smoke.json) { $text+="`n"+(Get-Content desktop-smoke.json -Raw) }
            @{body="Native Windows Electron smoke failed (CI-only test data):`n``````text`n$text`n``````"} | ConvertTo-Json | Set-Content -Encoding utf8 smoke-error.json
            gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input smoke-error.json
            exit $code
          }
      - name: Bind installed smoke and EXEs to this exact source commit
        run: node desktop/scripts/release-metadata.mjs create
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ember-desktop-windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
            desktop-smoke.json
            desktop-provenance.json
            desktop-smoke.json.*
            desktop-smoke.json.engine.log
            desktop-smoke.log
            backend-test.log
            desktop-package.log
          retention-days: 14
  publish:
    needs: [windows, first-table-browser]
    # Ordinary branch pushes / PRs only build artifacts. A tag or explicit
    # maintainer dispatch is required; no commit-message release shortcut.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ember-desktop-windows-x64
          path: package
      - name: Publish immutable prerelease assets from this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          (cd package/desktop/dist && for sum in *.sha256; do sed 's/\r$//' "$sum" | sha256sum --check --strict -; done)
          node desktop/scripts/release-metadata.mjs verify package "$COMMIT"
          VERSION=$(node desktop/scripts/release-metadata.mjs versions | python3 -c 'import sys,json; print(json.load(sys.stdin)["desktop_version"])')
          TAG="desktop-v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo 'Tag and package version differ; publication refused.'
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo 'Release exists. Do not silently replace reviewed binaries.'
            exit 1
          fi
          gh release create "$TAG" --repo "$REPO" --target "$COMMIT" --prerelease --title "余烬桌面 $VERSION · 房主安装器" --notes "Electron + TypeScript + Vite + Vue。来源：$COMMIT。含安装器／便携 EXE、SHA256、此构建的真实安装冒烟与 desktop-provenance.json。房主安装，同伴浏览器身份＋密钥入座。未代码签名；首次环境下载需网络；实际多人、网卡／防火墙和付费供应商仍需实机验证。" package/desktop/dist/*.exe package/desktop/dist/*.sha256 package/desktop-smoke.json package/desktop-provenance.json
      - name: Diagnose release artifact layout
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find package -maxdepth 4 -type f | sort)
          gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="Desktop publish failed. Artifact layout (CI-only data):
          $files"

  first-table-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ''
      DECISION_API_KEY: ''
      TTS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --prefix desktop
      - run: npm ci --prefix web && npm run build --prefix web
      - run: npm run build --prefix desktop && npm test --prefix desktop
      - run: python -m playwright install --with-deps chromium
      - name: Prepare isolated real host and private engine
        run: |
          mkdir -p desktop/resources/bin
          (cd launcher && go build -o ../desktop/resources/bin/ember-engine .)
          npm run prepare:host --prefix desktop
      - name: Wizard / guest / assignment / restart / recovery browser acceptance
        run: |
          python tests/browser_m0.py --seed
          export EMBER_DESKTOP_PREVIEW_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          node desktop/scripts/preview.mjs > artifacts-desktop-preview.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat artifacts-desktop-preview.log' EXIT
          python -c "import urllib.request,time; exec('for attempt in range(100):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:8765\");break\n except OSError:time.sleep(.1)\nelse:raise SystemExit(\"preview did not start\")')"
          python tests/browser_m0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-table-browser-evidence
          path: |
            artifacts/desktop-m0-evidence/
            artifacts-desktop-preview.log
          retention-days: 7
