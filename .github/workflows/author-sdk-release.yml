name: Publish immutable author SDK
on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the matching existing SDK tag after rights and source checks'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Match version, tag and immutable source commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          SDK_VERSION="$(python -c 'import json; print(json.load(open("author-sdk.json"))["version"])')"
          [[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid SDK version" >&2; exit 2; }
          SDK_TAG="sdk-v$SDK_VERSION"
          if [[ "$EVENT_REF" == refs/tags/* && "$EVENT_REF" != "refs/tags/$SDK_TAG" ]]; then
            echo "SDK tag differs from author-sdk.json" >&2; exit 2
          fi
          tag_commit="$(git rev-parse "refs/tags/$SDK_TAG^{commit}")"
          [[ "$tag_commit" == "$SOURCE_COMMIT" ]] || { echo "SDK tag must point to the source commit" >&2; exit 2; }
          printf 'SDK_VERSION=%s\nSDK_TAG=%s\n' "$SDK_VERSION" "$SDK_TAG" >> "$GITHUB_ENV"
      - name: Build release only after clean source and explicit licensing
        run: |
          set -euo pipefail
          python scripts/author_sdk.py build "release/ember-author-sdk-$SDK_VERSION.zip" --release
          SDK_SHA="$(cut -d' ' -f1 "release/ember-author-sdk-$SDK_VERSION.zip.sha256")"
          python scripts/author_sdk.py verify "release/ember-author-sdk-$SDK_VERSION.zip" --sha256 "$SDK_SHA" > release/sdk-verification.json
      - name: Publish new release; never replace existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$SDK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "SDK release already exists; refusing to replace assets" >&2; exit 2
          fi
          gh release create "$SDK_TAG" "release/ember-author-sdk-$SDK_VERSION.zip" "release/ember-author-sdk-$SDK_VERSION.zip.sha256" release/sdk-verification.json --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
