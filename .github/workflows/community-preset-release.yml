name: Publish a community preset release
on:
  workflow_call:
    inputs:
      preset_path:
        description: 'Preset directory relative to the caller repository root'
        required: true
        type: string
      release_tag:
        description: 'Must be preset-<id>-v<version>; the matching immutable tag must already exist'
        required: true
        type: string
      sdk_ref:
        description: 'Reviewed, immutable 40-character Ember-Tavern commit SHA'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submitted source as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: submission
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned author SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Tera-Dark/Ember-Tavern
          ref: ${{ inputs.sdk_ref }}
          path: ember-sdk
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install only the pinned SDK's declared Python dependencies
        run: python -m pip install -r ember-sdk/requirements-lock.txt
      - name: Validate rights declarations, exact locks, and package data
        id: validate
        env:
          PRESET_PATH: ${{ inputs.preset_path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SDK_REF: ${{ inputs.sdk_ref }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF:-}" == "refs/tags/$RELEASE_TAG" ]] || { echo "release workflow must run from its matching release tag" >&2; exit 2; }
          tag_commit="$(git -C submission rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] || { echo "release tag must point to the source commit that triggered this run" >&2; exit 2; }
          [[ "$SDK_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "sdk_ref must be an immutable 40-character commit SHA" >&2; exit 2; }
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('ember-sdk').resolve()))
          from server.presets.codec import load_folder
          root = Path('submission').resolve()
          raw = os.environ['PRESET_PATH']
          relative = Path(raw)
          if (not raw or raw.startswith('/') or '\\' in raw or ':' in raw
                  or any(part in ('', '.', '..') for part in raw.split('/'))):
              raise SystemExit('preset_path must be a clean repository-relative path')
          current = root
          for part in relative.parts:
              current = current / part
              if current.is_symlink():
                  raise SystemExit('preset submissions may not contain symlinks')
          source = current.resolve()
          if root not in source.parents or not source.is_dir():
              raise SystemExit('preset_path must name a repository-local directory')
          for entry in source.rglob('*'):
              if entry.is_symlink():
                  raise SystemExit(f'symlinks are not allowed: {entry.relative_to(root)}')
          package = load_folder(source)
          metadata = package.manifest['metadata']
          if not metadata['authors'] or not metadata['license'].strip() or metadata['license'].strip().upper() == 'UNLICENSED':
              raise SystemExit('public preset releases require author attribution and an explicit license')
          if package.warnings:
              raise SystemExit('all bundled components need declared authors and licenses: ' + ' | '.join(package.warnings))
          expected_tag = f"preset-{metadata['id']}-v{metadata['version']}"
          if os.environ['RELEASE_TAG'] != expected_tag:
              raise SystemExit(f"release tag must be exactly {expected_tag}")
          print(f"Validated {metadata['id']}@{metadata['version']} package_hash={package.package_hash}")
          PY
          python ember-sdk/scripts/creator.py validate "submission/$PRESET_PATH"
      - name: Build data-only archive and hash the exact bytes
        env:
          PRESET_PATH: ${{ inputs.preset_path }}
        run: |
          mkdir -p release
          python ember-sdk/scripts/creator.py package-preset "submission/$PRESET_PATH" "release/preset.zip"
          cd release
          sha256sum preset.zip > preset.zip.sha256
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release create "$RELEASE_TAG" release/preset.zip release/preset.zip.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
