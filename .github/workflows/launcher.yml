name: Launcher checks
on:
  push:
    branches: ['**']
    paths: ['launcher/**', '.github/workflows/launcher.yml', 'requirements-lock.txt']
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher.yml', 'requirements-lock.txt']
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: launcher/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-lock.txt
      - run: go vet ./...
        working-directory: launcher
      - if: runner.os == 'Linux'
        run: EMBER_LAUNCHER_TEST_PYTHON=python go test -race -v ./...
        working-directory: launcher
      - if: runner.os == 'Windows'
        shell: pwsh
        working-directory: launcher
        run: |
          $env:EMBER_LAUNCHER_TEST_PYTHON=(python -c "import sys; print(sys.executable)")
          $env:EMBER_LAUNCHER_WINDOWS_BOOTSTRAP='1'
          go test -v ./...
      - run: go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64
        working-directory: launcher
      - shell: bash
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H windowsgui -s -w' -o ember-launcher.exe .
        working-directory: launcher
      - uses: actions/upload-artifact@v4
        with:
          name: ember-launcher-windows-x64-${{ runner.os }}
          path: launcher/ember-launcher.exe
