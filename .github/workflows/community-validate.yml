name: Validate community work
on:
  workflow_call:
    inputs:
      kind:
        description: 'One of preset, scenario, worldbook, character, theme, plugin'
        required: true
        type: string
      source_path:
        description: 'Relative path inside the caller repository'
        required: true
        type: string
      sdk_ref:
        description: 'Reviewed, immutable 40-character Ember-Tavern commit SHA'
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submitted source as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: submission
          persist-credentials: false
      - name: Check out pinned author SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Tera-Dark/Ember-Tavern
          ref: ${{ inputs.sdk_ref }}
          path: ember-sdk
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install only the pinned SDK's declared Python dependencies
        run: python -m pip install -r ember-sdk/requirements-lock.txt
      - name: Validate contract and paths without executing submitted code
        env:
          WORK_KIND: ${{ inputs.kind }}
          SOURCE_PATH: ${{ inputs.source_path }}
          SDK_REF: ${{ inputs.sdk_ref }}
        run: |
          set -euo pipefail
          case "$WORK_KIND" in
            preset|scenario|worldbook|character|theme|plugin) ;;
            *) echo "Unsupported work kind" >&2; exit 2 ;;
          esac
          [[ "$SDK_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "sdk_ref must be an immutable 40-character commit SHA" >&2; exit 2; }
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path('submission').resolve()
          raw = os.environ['SOURCE_PATH']
          relative = Path(raw)
          if (not raw or raw.startswith('/') or '\\' in raw or ':' in raw
                  or any(part in ('', '.', '..') for part in raw.split('/'))):
              raise SystemExit('source_path must be a clean repository-relative path')
          current = root
          for part in relative.parts:
              current = current / part
              if current.is_symlink():
                  raise SystemExit('community submissions may not contain symlinks')
          source = current.resolve()
          if root not in source.parents and source != root:
              raise SystemExit('source_path escapes the submission checkout')
          if not source.exists():
              raise SystemExit('source_path does not exist')
          for entry in source.rglob('*') if source.is_dir() else ():
              if entry.is_symlink():
                  raise SystemExit(f'symlinks are not allowed: {entry.relative_to(root)}')
          PY
          if [[ "$WORK_KIND" == "plugin" ]]; then
            python ember-sdk/scripts/creator.py validate "submission/$SOURCE_PATH"
          else
            python ember-sdk/scripts/creator.py validate "submission/$SOURCE_PATH" --kind "$WORK_KIND"
          fi
