<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8b987f" stroke-width="1.2"/></marker></defs><rect width="1440" height="1030" fill="#f7f8f3"/><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif}.title{font-size:38px;fill:#254735;font-weight:600}.sub{font-size:21px;fill:#6e7e6d}.label{font-size:26px;fill:#2c4635;font-weight:600}.small{font-size:21px;fill:#6a7a69}.mini{font-size:18px;fill:#6a7a69}.mono{font-size:18px;fill:#a18049;font-family:monospace}</style><text x="60" y="78" class="title">余烬酒馆 · 小宿主，开放的冒险桌</text><text x="60" y="118" class="sub">CORE OWNS THE TRUTH. PLUGINS BRING THE PERFORMANCE.</text><rect x="60" y="162" width="1320" height="134" rx="16" fill="#294b38" stroke="#294b38"/><text x="88" y="205" style="font-size:27px;fill:#fff;font-weight:600">不可拔除的最小内核</text><text x="88" y="249" style="font-size:22px;fill:#d6e3d3">身份与房间 · 角色权限 · 权威规则与骰子 · 事件 / 快照 / 回档 · 认证素材存储</text><path d="M720 300V338" stroke="#8b987f" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="350" width="1320" height="103" rx="16" fill="#edeede" stroke="#d5ddcf"/><text x="88" y="392" class="label">插件宿主 / SDK v1</text><text x="390" y="392" class="small">清单与哈希 · 依赖图 · 能力与角色双重校验 · 版本化资源</text><text x="88" y="430" class="small">state._plugins[id]：schema_version / revision / data       开关独立于剧情时间线</text><rect x="60" y="515" width="200" height="160" rx="16" fill="#fff" stroke="#d5ddcf"/><text x="77" y="555" class="label">AI 主持</text><text x="77" y="594" class="mono">ai-host</text><text x="77" y="640" class="mini">可关，改人工主持</text><path d="M160 456V504" stroke="#adb89d" stroke-width="1.8" marker-end="url(#a)"/><rect x="284" y="515" width="200" height="160" rx="16" fill="#fff" stroke="#d5ddcf"/><text x="301" y="555" class="label">地图显示</text><text x="301" y="594" class="mono">scene-map</text><text x="301" y="640" cla